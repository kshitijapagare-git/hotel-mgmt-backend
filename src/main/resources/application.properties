# Generated by synth from hotel-booking-management
spring.application.name=hotelbookingmanagement

# Default to in-memory H2 so the app boots out of the box.
# Integration tests override these via Testcontainers.
spring.datasource.url=jdbc:h2:mem:synth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Request tracing — include X-Request-ID correlation ID in every log line
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{correlationId:--}] %logger{36} - %msg%n
